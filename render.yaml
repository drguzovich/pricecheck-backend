services:
  - type: web
    name: pricecheck-backend
    env: node
    plan: free
    # PLAYWRIGHT_BROWSERS_PATH must be set BEFORE the install so the binary
    # lands in a path that Render's build cache can persist and the runtime
    # can find.  --with-deps is omitted because Render's build sandbox does
    # not allow apt-get / root-level package installs.
    buildCommand: >-
      npm install --legacy-peer-deps &&
      npm run build:pwa &&
      PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/.cache/playwright
      npx playwright install chromium
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.cache/playwright
      - key: DATABASE_URL
        sync: false   # value is set manually in the Render dashboard — never committed
      - key: PARSE_API_KEY
        sync: false
      # Empty protected placeholders: configure values in Render, never source.
      - key: SCRAPER_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: USER_SYNC_JWT_SECRET
        sync: false
      - key: ADMIN_REFRESH_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PRICECHECK_WEB_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: APP_SESSION_SECRET
        sync: false
      - key: TROLLEYWISE_WEB_URL
        sync: false
      - key: AUTH_PUBLIC_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: https://pricecheck-backend-7tkh.onrender.com
      - key: WATCHLIST_WORKER_ENABLED
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
  - type: cron
    name: pricecheck-alerts
    env: node
    schedule: "0 */6 * * *"
    # Canonical declared identity. The current dashboard has no cron service.
    # Activate only after the owner approves Render worker billing.
    buildCommand: >-
      npm install --legacy-peer-deps &&
      PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/.cache/playwright
      npx playwright install chromium
    startCommand: npm run watchlist:run
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.cache/playwright
      - key: WATCHLIST_WORKER_ENABLED
        value: "true"
      - key: WATCHLIST_BATCH_LIMIT
        value: "200"
      - key: WATCHLIST_MAX_RUNTIME_MS
        value: "1200000"
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: SCRAPER_API_KEY
        sync: false
      - key: PARSE_API_KEY
        sync: false
      - key: RETAILER_TIMEOUT_MS
        value: "15000"
      - key: PRICECHECK_WEB_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
